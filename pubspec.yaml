name: pawtable
description: "Your Pet, At Your Table — An all-in-one pet wellness companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.3
  injectable: ^2.5.0
  rxdart: ^0.28.0

  # Navigation
  go_router: ^16.2.0

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.1

  # Billing / Subscriptions
  purchases_flutter: ^9.5.0

  # Data visualization
  fl_chart: ^0.69.2

  # PDF generation & file handling
  pdf: ^3.11.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

  # UI utilities
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  collection: ^1.19.0
  timezone: ^0.10.1
  uuid: ^4.5.1
  equatable: ^2.0.5

  # Permissions & device
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  connectivity_plus: ^6.1.1

  # Logging
  logger: ^2.5.0

  # Code generation annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  mockito: ^5.4.4

  # Code generation
  build_runner: ^2.5.0
  freezed: ^2.5.8
  json_serializable: ^6.9.0
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts (to be added when font assets are downloaded)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: fonts/Poppins-Regular.ttf
  #       - asset: fonts/Poppins-Bold.ttf
  #         weight: 700
